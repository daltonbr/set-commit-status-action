# Builds the action and then runs it against itself ("Self Check") to prove the
# committed dist/ actually works. Also warns, without failing, when dist/ no
# longer matches src/; the blocking version of that check lives in publish.yml,
# because a stale bundle only reaches users at release time.

name: 'Build and Test'

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run all

      - name: Check dist/ is up to date
        run: |
          if ! git diff --quiet dist/; then
            echo "::warning::dist/ is out of date. Run 'npm run package' locally and commit the result."
            git diff --stat dist/
            echo "## dist/ is out of date" >> $GITHUB_STEP_SUMMARY
            echo "Run \`npm run package\` locally and commit the result." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git diff --stat dist/ >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name && github.event.sender.login != 'dependabot[bot]' ||
      github.event_name == 'push' && !contains(github.event.head_commit.message, '[ci skip]')
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set commit status as pending
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending
          context: 'Self Check'
          # The action resolves the SHA itself for pull_request and push, but
          # not for workflow_dispatch. Left empty elsewhere on purpose: on a
          # pull request github.sha is the merge commit, so passing it
          # unconditionally would move the status off the PR head.
          sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

      - name: Set final commit status
        uses: ./
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: 'Self Check'
          # The action resolves the SHA itself for pull_request and push, but
          # not for workflow_dispatch. Left empty elsewhere on purpose: on a
          # pull request github.sha is the merge commit, so passing it
          # unconditionally would move the status off the PR head.
          sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
